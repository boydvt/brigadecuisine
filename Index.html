<!DOCTYPE html>
<html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Brigade Cuisine Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--tom:#E8503A;--tomd:#C23B27;--cream:#FFF6E5;--mint:#2BB38A;--mintd:#1E8C6B;--mus:#F5B82E;--musd:#D99A12;--navy:#2D3047;--ink:#3A2A1E;--sky:#3D7BC9;--line:#EAD9BF;--card:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:16px}
body{background-image:linear-gradient(45deg,#FCEBD0 25%,transparent 25%,transparent 75%,#FCEBD0 75%),linear-gradient(45deg,#FCEBD0 25%,transparent 25%,transparent 75%,#FCEBD0 75%);background-size:48px 48px;background-position:0 0,24px 24px;overflow-x:hidden}
h1,h2,h3,.bal{font-family:'Baloo 2','Nunito',sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 12px 96px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:19px;background:var(--tom);color:#fff;box-shadow:0 5px 0 var(--tomd);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tomd)}
.btn.g{background:var(--mint);box-shadow:0 5px 0 var(--mintd)}
.btn.y{background:var(--mus);box-shadow:0 5px 0 var(--musd);color:var(--ink)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:16px}
.muted{color:#8A7560;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
input,select{font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;width:100%;color:var(--ink)}
input:focus{outline:none;border-color:var(--mus)}
label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}

/* top bar */
#top{position:sticky;top:0;z-index:20;margin:0 -12px 12px;padding:10px 12px 8px;background:var(--navy);color:#fff;border-bottom:4px solid #1D1F30}
#top .r1{display:flex;align-items:center;gap:8px}
#top .logo{font-family:'Baloo 2';font-weight:800;font-size:18px;color:var(--mus)}
#top .meta{font-size:12px;opacity:.85;margin-left:auto;text-align:right}
.prog{display:flex;gap:4px;margin-top:8px}
.prog i{flex:1;height:8px;border-radius:6px;background:#4A4E6E;position:relative}
.prog i.on{background:var(--mus)}
.prog i.now{background:var(--tom);animation:pulse 1.2s infinite}
.mates{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.mate{display:flex;align-items:center;gap:3px;background:#3B3F5C;border-radius:20px;padding:2px 8px 2px 2px;font-size:12px;white-space:nowrap;position:relative}
.mate svg{width:22px;height:22px}
.mate.off{opacity:.45}
.mate.act{background:var(--tom)}
.mate.me{outline:2px solid var(--mus)}
.rolechip{display:inline-block;background:var(--mus);color:var(--ink);font-weight:800;border-radius:10px;padding:1px 8px;font-size:12px}

/* banner peran */
.stagehead{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.stagehead .ic{width:58px;height:58px;flex:none;border-radius:18px;background:#fff;border:3px solid var(--line);display:grid;place-items:center}
.stagehead .ic svg{width:44px;height:44px}
.stagehead h2{font-size:26px}
.who{background:#fff;border:2px dashed var(--mus);border-radius:14px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.who b{color:var(--tom)}
.mine{background:#FFF0C2;border:3px solid var(--mus)}

/* overlay */
#ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(45,48,71,.82);padding:20px}
#ov.show{display:flex}
#ov .box{background:#fff;border-radius:28px;padding:26px 22px;max-width:380px;width:100%;text-align:center;border:4px solid var(--mus);animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
#ov .box .big{font-family:'Baloo 2';font-size:34px;font-weight:800;color:var(--tom)}
#ov .chefimg{width:120px;margin:0 auto 6px;animation:bob 1.6s ease-in-out infinite}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.floaty{position:absolute;bottom:80px;font-size:34px;animation:floatup 2.6s ease-out forwards;text-align:center}
.floaty small{display:block;font-size:11px;font-weight:800;background:#fff;border-radius:8px;padding:0 6px;color:var(--ink)}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}

/* dock reaksi */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(255,246,229,.95) 30%)}
#dock.show{display:flex}
#dock button{width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--line);font-size:24px;box-shadow:0 4px 0 var(--line)}
#dock button:active{transform:translateY(3px);box-shadow:none}

/* join */
.hero{text-align:center;padding:26px 0 10px}
.hero h1{font-size:40px;color:var(--tom);text-shadow:0 3px 0 #FFD9A8}
.hero .sub{font-weight:700;color:var(--navy)}
.hero .chefimg{width:130px;margin:0 auto;animation:bob 1.8s ease-in-out infinite}
.gpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gpick button{padding:12px 0;border-radius:14px;background:#fff;border:3px solid var(--line);font-family:'Baloo 2';font-weight:800;font-size:20px}
.gpick button.on{background:var(--mus);border-color:var(--musd)}
.priv{background:#E6F7F1;border:2px solid #A8E2CF;border-radius:14px;padding:10px 12px;font-size:13px}

/* lobby */
.hats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hatc{text-align:center;font-weight:800;font-size:13px;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.hatc svg{width:58px;height:58px;margin:0 auto}
.hatc.off{opacity:.4}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:13px}
.roles b{display:block;font-family:'Baloo 2';font-size:16px;color:var(--tom)}
.door{position:relative;height:150px;display:flex;justify-content:center;align-items:flex-end}
.door .chefimg{width:120px;animation:bob 1.6s ease-in-out infinite}

/* menu */
.dishes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:#fff;border:3px solid var(--line);border-radius:20px;padding:8px 8px 10px;text-align:center;position:relative;box-shadow:0 5px 0 var(--line);transition:transform .15s}
.dcard .dish{width:100%;height:78px}
.dcard b{display:block;font-family:'Baloo 2';font-size:16px;line-height:1.1;margin-top:2px}
.dcard span{font-size:12px;color:#8A7560}
.dcard.sel{border-color:var(--tom);background:#FFF1EC;transform:translateY(-3px);box-shadow:0 8px 0 #F7B9A9}
.dcard.taken{filter:grayscale(1);opacity:.55}
.dcard .tk{position:absolute;top:8px;left:50%;transform:translateX(-50%) rotate(-8deg);background:var(--navy);color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:8px;white-space:nowrap}
.votes{display:flex;justify-content:center;gap:2px;min-height:22px;margin-top:4px}
.votes svg{width:22px;height:22px;animation:popin .4s}
.sticky{position:sticky;bottom:78px;z-index:10;margin-top:14px}

/* pasar */
.awning{height:34px;margin:0 -12px;background:repeating-linear-gradient(90deg,var(--tom) 0 34px,#fff 34px 68px);border-radius:0 0 50% 50%/0 0 18px 18px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.cartbar{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 10px;margin:10px 0}
#cart{width:56px;height:46px;flex:none}
#cart .wh{animation:spin 1s linear infinite;transform-origin:center;transform-box:fill-box}
.bitems{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-height:36px}
.bitems span{width:36px;height:36px;background:#FFF6E5;border-radius:10px;padding:3px;animation:popin .4s cubic-bezier(.2,1.6,.4,1)}
.wallet{font-family:'Baloo 2';font-weight:800;background:var(--mus);border-radius:12px;padding:2px 10px;white-space:nowrap}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#B9804B;border:4px solid #8A5A2E;border-radius:18px;padding:10px 8px 6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.it{background:#FFF8EC;border-radius:14px;padding:6px 4px 4px;position:relative;border:3px solid transparent;transition:transform .12s}
.it svg{width:100%;height:52px}
.it .pr{position:absolute;top:-6px;right:-4px;background:var(--mus);border-radius:8px;padding:0 5px;font-size:11px;font-weight:800;border:2px solid var(--musd)}
.it.in{border-color:var(--mint);background:#E6F7F1}
.it.in:after{content:'✓';position:absolute;left:4px;top:2px;background:var(--mint);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;display:grid;place-items:center;font-weight:900}
.it.sel{border-color:var(--tom);transform:scale(1.06)}
.it .nm{display:block;font-size:10.5px;font-weight:800;text-align:center;line-height:1.1;min-height:12px}
.pingb{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--tom);color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:1px 6px;white-space:nowrap;animation:popin .3s;z-index:2}
.fiche{background:#FFFDF6;border:3px solid var(--line);border-radius:18px;padding:14px 16px;position:relative;background-image:repeating-linear-gradient(transparent 0 27px,#F1E4CF 27px 28px);background-position:0 44px}
.fiche h3{font-size:22px;color:var(--tom)}
.fiche ul{margin:8px 0 0;padding-left:20px;line-height:28px;font-weight:700}
.pinbar{position:sticky;bottom:78px;z-index:10;background:#fff;border:3px solid var(--tom);border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px;margin-top:12px;animation:slideup .25s}
.pinbar .pic{width:54px;height:54px;flex:none}
.pinbar .nmb{flex:1;font-family:'Baloo 2';font-size:20px;font-weight:800;line-height:1}
.spk{width:36px;height:36px;border-radius:50%;background:var(--sky);color:#fff;display:inline-grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px}

/* langkah */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:8px;align-items:flex-start;background:#fff;border:3px dashed var(--line);border-radius:16px;padding:8px 10px;min-height:50px}
.slot .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-family:'Baloo 2'}
.slot.f{border-style:solid;border-color:var(--mint);animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
.slot .tx{flex:1;font-weight:700;font-size:15px;line-height:1.35}
.pool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.scard{display:flex;gap:8px;align-items:center;background:#FFF1C9;border:3px solid var(--mus);border-radius:16px;padding:10px 12px;font-weight:700;font-size:15px;line-height:1.35;box-shadow:0 4px 0 var(--musd);position:relative;text-align:left;width:100%}
.scard .tx{flex:1}
.inf{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:0 6px;font-weight:800}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--tom);color:var(--tom);font-weight:900;text-align:center}
.trapnote{background:#FFE3DD;border:2px solid #F6A592;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;margin-bottom:10px}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.vchips button{padding:6px 12px;border-radius:12px;background:#F2EEE8;border:2px solid var(--line);font-weight:800;font-size:15px}
.vchips button.on{background:var(--sky);border-color:#2C5E9E;color:#fff}
.chkl{display:flex;flex-direction:column;gap:8px}
.chki{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 12px}
.chki .tx{font-weight:700;line-height:1.4}
.bask2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bk{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px;text-align:center;font-size:12px;font-weight:800;position:relative}
.bk svg{width:44px;height:44px;margin:0 auto}
.bk.rmd{opacity:.5;border-style:dashed}
.bk button{margin-top:4px;font-size:12px;padding:3px 8px;border-radius:9px;background:#FFE3DD;font-weight:800}
.bk.rmd button{background:#E6F7F1}

/* masak */
.kitchen{position:relative;background:linear-gradient(#BFE6F2 0 46%,#F4D6A8 46% 100%);border:4px solid var(--navy);border-radius:24px;overflow:hidden;height:210px}
.kitchen:before{content:'';position:absolute;left:0;right:0;top:46%;height:12px;background:#8A5A2E}
.kitchen .win{position:absolute;left:14px;top:12px;width:70px;height:56px;background:#E9F8FF;border:4px solid #fff;border-radius:8px}
.kitchen .tool{position:absolute;left:50%;bottom:10px;width:250px;transform:translateX(-50%)}
.kitchen .kchef{position:absolute;right:6px;top:14px;width:84px;animation:bob 1.4s ease-in-out infinite}
.kitchen .bub{position:absolute;left:96px;top:14px;right:96px;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:6px 10px;font-family:'Baloo 2';font-weight:800;font-size:18px;text-align:center;line-height:1.1}
.whisk{animation:whisk .5s linear infinite;transform-origin:100px 50px}
.knife{animation:chop .45s ease-in-out infinite;transform-origin:150px 30px}
.flame path{animation:flick .3s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}
.steam path,.steam{animation:steam 1.6s ease-in-out infinite}
.jug{animation:tilt 2s ease-in-out infinite;transform-origin:140px 30px}
.stream{animation:stream 2s ease-in-out infinite}
.cloche{animation:lift 2s ease-in-out infinite}
.spark{animation:twinkle 1s ease-in-out infinite}
.drop{animation:drop 1.2s ease-in infinite}
.clock{animation:pulse 1s infinite}
.paused *{animation-play-state:paused!important}
.cdots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.cdots i{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px}
.cdots i.d{background:var(--mint);border-color:var(--mintd);color:#fff}
.cdots i.c{background:var(--tom);border-color:var(--tomd);color:#fff;animation:pulse 1s infinite}
.pad{margin-top:12px;height:230px;border-radius:26px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;border:4px solid #1D1F30}
.pad .verb{font-family:'Baloo 2';font-size:34px;font-weight:800;color:var(--mus)}
.pad .hint{font-size:15px;opacity:.9;padding:0 16px}
.pad .meter{width:80%;height:26px;border-radius:14px;background:#4A4E6E;margin-top:14px;position:relative;overflow:hidden}
.pad .meter .zone{position:absolute;top:0;bottom:0;left:65%;width:20%;background:rgba(43,179,138,.6)}
.pad .meter .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--tom)}
.pad .cnt{font-family:'Baloo 2';font-size:54px;font-weight:800;line-height:1}
.pad .ring{position:absolute;inset:0;pointer-events:none}
.pad.hit{animation:hit .12s}
.pad .res{font-family:'Baloo 2';font-size:40px;font-weight:800;animation:popin .4s cubic-bezier(.2,1.6,.4,1)}

/* hasil */
.reveal{position:relative;height:220px;display:flex;align-items:flex-end;justify-content:center}
.reveal .dish{width:270px;height:186px}
.reveal .clo{position:absolute;bottom:26px;left:50%;width:250px;margin-left:-125px;animation:clo 2.2s ease-in forwards}
.reveal .rays{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-200px 0 0 -180px;background:repeating-conic-gradient(rgba(245,184,46,.35) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 12s linear infinite;opacity:0;animation-delay:1.6s;animation-fill-mode:forwards}
.dish.perfect .dg{animation:bob 2s ease-in-out infinite}
.dish.meh .dg{filter:saturate(.6)}
.dish.rate .dg{filter:sepia(1) saturate(1.6) brightness(.42)}
.smoke{position:absolute;bottom:90px;width:40px;height:40px;border-radius:50%;background:#7D7D7D;opacity:0;animation:smoke 2.4s ease-out infinite}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars svg{width:54px;height:54px;opacity:.18}
.stars svg.on{opacity:1;animation:starpop .6s cubic-bezier(.2,1.6,.4,1) both}
.bignum{font-family:'Baloo 2';font-size:64px;font-weight:800;color:var(--tom);text-align:center;line-height:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar .lb{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.bar .tr{height:14px;border-radius:8px;background:#F1E4CF;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.mist{font-size:14px;line-height:1.5}
.mist .bad{color:var(--tomd);font-weight:800}
.mist .good{color:var(--mintd);font-weight:800}
.recipe ol{padding-left:22px;margin:6px 0;line-height:1.5;font-weight:600}
.recipe li.x{color:var(--tomd)}
.quote{display:flex;gap:10px;align-items:center}
.quote .chefimg{width:80px;flex:none}
.quote .sb{background:#fff;border:3px solid var(--navy);border-radius:18px;padding:10px 12px;font-family:'Baloo 2';font-weight:800;font-size:18px;line-height:1.15}
.fact{background:#E8F1FF;border:3px solid #B5CFF5;border-radius:18px;padding:12px 14px;font-size:14px}
.fact b{font-family:'Baloo 2';font-size:17px;color:var(--sky)}

/* guru */
.gtable{display:flex;flex-direction:column;gap:10px}
.gcard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px}
.gcard h3{font-size:20px}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;background:#F2EEE8}
.tag.st{background:var(--navy);color:#fff}
.tag.ok{background:var(--mint);color:#fff}
.claims{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.claims div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.claims div.t{background:#FFF1EC;border-color:#F7B9A9}
.rank{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:800}
.rank .p{font-family:'Baloo 2';font-size:26px;width:36px;text-align:center;color:var(--tom)}

/* animasi */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes enter{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-40px) scale(1.1)}100%{transform:translateY(-70vh) scale(1);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes whisk{0%{transform:rotate(-18deg) translateX(-6px)}50%{transform:rotate(18deg) translateX(6px)}100%{transform:rotate(-18deg) translateX(-6px)}}
@keyframes chop{0%,100%{transform:rotate(0)}50%{transform:rotate(22deg)}}
@keyframes flick{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}

  /* ---- layar masuk ---- */
